name: PC app

# Tests the PC version and builds its Windows installer. Only main publishes it, to the
# "pc-latest" release; other branches just check that it builds.
on:
  push:
    paths:
      - 'pc/**'
      - 'android/app/src/main/java/com/barion/filmscans/core/**'
      - 'android/app/src/test/**'
      - '.github/workflows/pc.yml'
  pull_request:
    paths:
      - 'pc/**'
      - 'android/app/src/main/java/com/barion/filmscans/core/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and compile
        run: ./android/gradlew -p pc --stacktrace test compileKotlin

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installer
        shell: bash
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          ./android/gradlew -p pc --stacktrace packageMsi
          cp pc/build/compose/binaries/main/msi/*.msi "EtTuTiff-PC-${{ github.run_number }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-installer
          path: EtTuTiff-PC-*.msi
          retention-days: 1
      - name: Publish to the pc-latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc-latest --yes --cleanup-tag || true
          gh release create pc-latest "EtTuTiff-PC-${{ github.run_number }}.msi" \
            --target "${{ github.sha }}" --latest=false \
            --title "Et Tu, Tiff? for Windows, build ${{ github.run_number }}" \
            --notes "Windows 10 or 11. Installs for your Windows account only, no administrator needed. Built from ${{ github.sha }}."
