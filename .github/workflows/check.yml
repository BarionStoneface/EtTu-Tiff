name: Check

# Tests and builds every branch other than main, without publishing anything.
# main is built and released by build.yml.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and build
        working-directory: android
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: Keep the APK, to try a branch on a phone
        run: cp android/app/build/outputs/apk/release/app-release.apk "EtTuTiff-${{ github.ref_name }}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: EtTuTiff-*.apk
          retention-days: 14

      - name: Show the lint report
        if: always()
        run: cat android/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
